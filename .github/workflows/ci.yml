name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Type check
        run: pnpm tsc --noEmit

      - name: Unit tests
        run: pnpm test

      - name: Prettier check
        run: pnpm prettier --check src

      - name: Build
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      # The runner image ships google-chrome-stable. E2E_REQUIRE_BROWSER makes
      # a missing browser fail the job instead of skipping the tests.
      - name: Browser tests
        run: |
          CHROMIUM_PATH=$(command -v google-chrome-stable)
          export CHROMIUM_PATH E2E_REQUIRE_BROWSER=1
          "$CHROMIUM_PATH" --version
          pnpm test:e2e

      - name: Upload crash dumps
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-crashes
          path: test-results/e2e-crashes/
          if-no-files-found: ignore
